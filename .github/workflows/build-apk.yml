name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - packaging/android/**
      - .github/workflows/build-apk.yml

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer le SDK Android
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools/* "$HOME/android-sdk/cmdline-tools/latest/"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses >/dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compiler l'APK
        working-directory: packaging/android
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > "$RUNNER_TEMP/apk-build.log" 2>&1
          code=$?
          tail -n 30 "$RUNNER_TEMP/apk-build.log" | while IFS= read -r line; do
            echo "::error title=APK::$line"
          done
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: EIR-apk
          path: packaging/android/app/build/outputs/apk/debug/app-debug.apk
